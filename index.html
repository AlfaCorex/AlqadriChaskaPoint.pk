<!-- FIREBASE REAL-TIME BACKEND ENGINE FOR ALQADRI CHASKA POINT (NO AUTO-SEEDING) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { 
        getFirestore, 
        collection, 
        doc, 
        setDoc, 
        addDoc, 
        updateDoc, 
        deleteDoc, 
        onSnapshot, 
        query, 
        orderBy, 
        enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 1. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAU3wBPK_iKzH-F0qfRp9KFG4Keq8tmm2U",
        authDomain: "alfa-corex-1-c9856.firebaseapp.com",
        projectId: "alfa-corex-1-c9856",
        storageBucket: "alfa-corex-1-c9856.firebasestorage.app",
        messagingSenderId: "685367477889",
        appId: "1:685367477889:web:f83b7028683df4fdc96f80",
        measurementId: "G-ZKPVH2RPW5"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Offline Cache Support
    enableIndexedDbPersistence(db).catch((err) => {
        console.warn("Persistence error:", err.code);
    });

    const menuRef = collection(db, "menu");
    const ordersRef = collection(db, "orders");
    const postsRef = collection(db, "posts");
    const usersRef = collection(db, "users");

    // ==========================================
    // REAL-TIME LISTENERS (WITHOUT AUTO-SEEDING)
    // ==========================================

    // A. Real-Time Menu Sync (No auto-seed)
    onSnapshot(menuRef, (snapshot) => {
        const fetchedMenu = [];
        snapshot.forEach((doc) => {
            fetchedMenu.push({ ...doc.data(), docId: doc.id });
        });

        window.menuData = fetchedMenu;
        window.workingMenuData = JSON.parse(JSON.stringify(fetchedMenu));
        
        if (typeof window.renderCustomerMenu === 'function') window.renderCustomerMenu();
        if (typeof window.renderLocalMenu === 'function') window.renderLocalMenu();
        if (typeof window.renderDrinksMenu === 'function') window.renderDrinksMenu();
        if (typeof window.renderAdminCatalog === 'function') window.renderAdminCatalog();
    }, (error) => console.error("Menu Sync Error:", error));

    // B. Real-Time Orders Sync
    onSnapshot(ordersRef, (snapshot) => {
        const fetchedOrders = [];
        snapshot.forEach((doc) => {
            fetchedOrders.push({ ...doc.data(), docId: doc.id });
        });

        fetchedOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        window.ordersList = fetchedOrders;
        if (typeof window.renderAdminOrdersList === 'function') window.renderAdminOrdersList();
    }, (error) => console.error("Orders Sync Error:", error));

    // C. Real-Time Social Posts Sync (No auto-seed)
    onSnapshot(postsRef, (snapshot) => {
        const fetchedPosts = [];
        snapshot.forEach((doc) => {
            fetchedPosts.push({ ...doc.data(), docId: doc.id });
        });

        fetchedPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        window.feedPosts = fetchedPosts;
        window.workingFeedPosts = JSON.parse(JSON.stringify(fetchedPosts));

        if (typeof window.renderCustomerSocialFeeds === 'function') window.renderCustomerSocialFeeds();
        if (typeof window.renderAdminPostsList === 'function') window.renderAdminPostsList();
    }, (error) => console.error("Posts Sync Error:", error));

    // D. Real-Time Registered Users Sync
    onSnapshot(usersRef, (snapshot) => {
        const fetchedUsers = [];
        snapshot.forEach((doc) => {
            fetchedUsers.push({ ...doc.data(), docId: doc.id });
        });

        window.registeredUsers = fetchedUsers;
        if (typeof window.renderRegisteredUsers === 'function') window.renderRegisteredUsers();
    }, (error) => console.error("Users Sync Error:", error));


    // ==========================================
    // MANUAL CRUD OPERATIONS VIA ADMIN & USER ACTIONS
    // ==========================================

    window.handleFoodFormSubmit = async function(event) {
        event.preventDefault();
        const editId = document.getElementById('editFoodId').value;
        const name = document.getElementById('foodFormName').value.trim();
        const price = parseInt(document.getElementById('foodFormPrice').value);
        let image = document.getElementById('foodFormImage').value.trim();
        const desc = document.getElementById('foodFormDesc').value.trim();
        const category = document.getElementById('foodFormCategory').value;

        if (!name || isNaN(price)) {
            window.showNotification('Please fill in required name and price fields.', 'warning');
            return;
        }

        if (!image) image = 'https://placehold.co/400x300/FF5A36/ffffff?text=ACP';

        try {
            if (editId) {
                const docRef = doc(db, "menu", editId.toString());
                await updateDoc(docRef, { name, price, image, desc, category });
                window.showNotification('Catalog item updated!');
            } else {
                const newId = Date.now();
                const docRef = doc(db, "menu", newId.toString());
                await setDoc(docRef, { id: newId, name, price, image, desc, category });
                window.showNotification('Product added to database!');
            }
            window.resetAdminForm();
        } catch (e) {
            console.error("Catalog Save Error:", e);
            window.showNotification('Failed to save item.', 'warning');
        }
    };

    window.deleteFoodCatalog = async function(id) {
        try {
            await deleteDoc(doc(db, "menu", id.toString()));
            window.showNotification('Item removed from catalog.');
        } catch (e) {
            console.error("Delete Food Error:", e);
        }
    };

    window.saveCatalogOrderChanges = async function() {
        try {
            for (let i = 0; i < window.workingMenuData.length; i++) {
                const item = window.workingMenuData[i];
                await setDoc(doc(db, "menu", item.id.toString()), item, { merge: true });
            }
            document.getElementById('catalogUpdateBar')?.classList.add('hidden');
            window.showNotification('Catalog order saved!');
        } catch(e) {
            console.error("Catalog reorder error:", e);
        }
    };

    window.finalizeOrderAndSendWhatsApp = async function() {
        const keys = Object.keys(window.cartItems);
        if (keys.length === 0) return;

        const name = document.getElementById('checkoutName').value.trim();
        const phone = document.getElementById('checkoutPhone').value.trim();
        const location = document.getElementById('checkoutLocation').value.trim();

        if (!name || !phone || !location) {
            window.showNotification('Please fill in Name, Phone and Location.', 'warning');
            return;
        }

        const orderNum = Math.floor(1000 + Math.random() * 9000);
        const orderId = '#ACP-' + orderNum;
        let itemsDetail = [];
        let grandTotal = 0;

        keys.forEach(id => {
            const item = window.menuData.find(x => x.id == id);
            if (item) {
                const qty = window.cartItems[id];
                const total = item.price * qty;
                grandTotal += total;
                itemsDetail.push({ name: item.name, qty: qty, price: item.price, total: total });
            }
        });

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = new Date().toLocaleDateString();

        const newOrder = {
            id: orderId,
            customerName: name,
            phone: phone,
            location: location,
            date: dateStr,
            time: timeStr,
            timestamp: Date.now(),
            items: itemsDetail,
            total: grandTotal,
            status: 'Pending'
        };

        try {
            await setDoc(doc(db, "orders", orderNum.toString()), newOrder);

            let waMsg = `*🛒 NEW ORDER - ALQADRI CHASKA POINT*\n`;
            waMsg += `*Order ID:* ${orderId}\n`;
            waMsg += `*Customer:* ${name}\n`;
            waMsg += `*Phone:* ${phone}\n`;
            waMsg += `*Location:* ${location}\n\n`;
            waMsg += `*Items Ordered:*\n`;
            itemsDetail.forEach(it => {
                waMsg += `• ${it.name} x${it.qty} = Rs. ${it.total}\n`;
            });
            waMsg += `\n*Grand Total:* Rs. ${grandTotal}\n`;
            waMsg += `Thank you! Please prepare my order.`;

            const whatsappUrl = `https://wa.me/923102434222?text=${encodeURIComponent(waMsg)}`;

            window.closeCheckoutConfirmModal();
            window.showNotification(`Order ${orderId} saved! Opening WhatsApp...`);
            window.addOrderNotification(`Order Placed (${orderId})`, `Order sent to WhatsApp.`);

            window.cartItems = {};
            window.renderCustomerMenu();
            window.renderLocalMenu();
            window.renderDrinksMenu();
            window.renderCartSummary();

            window.open(whatsappUrl, '_blank');
        } catch(e) {
            console.error("Order Place Error:", e);
        }
    };

    window.approveAdminOrder = async function(index) {
        const ord = window.ordersList[index];
        if (!ord) return;

        try {
            const cleanDocId = ord.docId || ord.id.replace('#ACP-', '');
            await updateDoc(doc(db, "orders", cleanDocId), { status: 'Approved' });
            window.showNotification(`Order ${ord.id} Approved!`);
        } catch(e) {
            console.error("Approve order error:", e);
        }
    };

    window.removeAdminOrder = async function(index) {
        const ord = window.ordersList[index];
        if (!ord) return;

        try {
            const cleanDocId = ord.docId || ord.id.replace('#ACP-', '');
            await deleteDoc(doc(db, "orders", cleanDocId));
            window.showNotification('Order record deleted.');
        } catch(e) {
            console.error("Delete order error:", e);
        }
    };

    window.handleFeedPostSubmit = async function(event) {
        event.preventDefault();

        const editId = document.getElementById('editPostId').value;
        const title = document.getElementById('postFormTitle').value.trim();
        const image = document.getElementById('postFormImage').value.trim();
        const desc = document.getElementById('postFormDesc').value.trim();

        if (!title || !image || !desc) {
            window.showNotification('Please fill in required post details.', 'warning');
            return;
        }

        const adminAuthorName = "Alqadri Chaska Point";

        try {
            if (editId) {
                await updateDoc(doc(db, "posts", editId.toString()), {
                    title, image, desc, authorName: adminAuthorName
                });
                window.showNotification('Post updated live!');
            } else {
                const newId = Date.now();
                await setDoc(doc(db, "posts", newId.toString()), {
                    id: newId,
                    title,
                    image,
                    desc,
                    authorName: adminAuthorName,
                    timestamp: Date.now(),
                    likes: 0,
                    likedUsers: [],
                    comments: []
                });
                window.showNotification('New post broadcasted live!');
            }
            window.resetPostForm();
        } catch(e) {
            console.error("Post Broadcast Error:", e);
        }
    };

    window.deleteFeedPost = async function(postId) {
        try {
            await deleteDoc(doc(db, "posts", postId.toString()));
            window.showNotification('Post deleted.', 'warning');
        } catch(e) {
            console.error("Delete Post Error:", e);
        }
    };

    window.likePost = async function(id) {
        const post = window.feedPosts.find(p => p.id === id);
        if (!post) return;

        let identifier = window.currentUser ? window.currentUser.phone : (window.guestSessionName || "guest_session");
        let likedUsers = post.likedUsers ? [...post.likedUsers] : [];
        let likes = post.likes || 0;

        if (likedUsers.includes(identifier)) {
            likedUsers = likedUsers.filter(u => u !== identifier);
            likes = Math.max(0, likes - 1);
        } else {
            likedUsers.push(identifier);
            likes += 1;
        }

        try {
            await updateDoc(doc(db, "posts", id.toString()), { likes, likedUsers });
        } catch(e) {
            console.error("Like post error:", e);
        }
    };

    window.submitComment = async function(id) {
        const post = window.feedPosts.find(p => p.id === id);
        const input = document.getElementById(`comment-input-${id}`);
        if (!post || !input) return;

        const commentText = input.value.trim();
        if (!commentText) return;

        let commenterName = window.currentUser ? window.currentUser.name : (window.guestSessionName || "");
        if (!commenterName) {
            window.openGuestNameModal();
            return;
        }

        let updatedComments = JSON.parse(JSON.stringify(post.comments || []));

        const replyToIndex = input.dataset.replyToIndex;
        if (replyToIndex !== undefined && replyToIndex !== "") {
            const idx = parseInt(replyToIndex);
            if (updatedComments[idx]) {
                if (!updatedComments[idx].replies) updatedComments[idx].replies = [];
                updatedComments[idx].replies.push({
                    commenter: commenterName,
                    text: commentText,
                    isAdmin: false,
                    timestamp: Date.now(),
                    likes: 0,
                    dislikes: 0,
                    likedUsers: [],
                    dislikedUsers: []
                });
            }
            delete input.dataset.replyToIndex;
        } else {
            updatedComments.push({
                commenter: commenterName,
                text: commentText,
                isAdmin: false,
                timestamp: Date.now(),
                likes: 0,
                dislikes: 0,
                likedUsers: [],
                dislikedUsers: [],
                replies: []
            });
        }

        try {
            await updateDoc(doc(db, "posts", id.toString()), { comments: updatedComments });
            input.value = '';
        } catch(e) {
            console.error("Submit Comment Error:", e);
        }
    };

    window.registerUser = async function() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const loc = document.getElementById('regLocation').value.trim();
        const email = document.getElementById('regEmail').value.trim() || 'No Email';

        if(!name || !phone || !loc) {
            window.showNotification('Please fill in Name, Phone, and Location.', 'warning');
            return;
        }

        const newUser = { name, phone, location: loc, email, createdAt: Date.now() };

        try {
            const userDocRef = doc(db, "users", phone.replace(/[^0-9]/g, ''));
            await setDoc(userDocRef, newUser);

            window.currentUser = newUser;
            localStorage.setItem('acp_current_user', JSON.stringify(window.currentUser));
            window.updateUserAccountDisplay();

            window.showNotification(`Welcome, ${name}!`);
            window.closeUserModal();

            document.getElementById('regName').value = '';
            document.getElementById('regPhone').value = '';
            document.getElementById('regLocation').value = '';
            document.getElementById('regEmail').value = '';
        } catch(e) {
            console.error("Register error:", e);
        }
    };

    window.removeCustomerRecord = async function(idx) {
        const user = window.registeredUsers[idx];
        if (!user) return;

        try {
            const cleanDocId = user.docId || user.phone.replace(/[^0-9]/g, '');
            await deleteDoc(doc(db, "users", cleanDocId));
            window.showNotification('Customer deleted.');
        } catch(e) {
            console.error("Remove CRM user error:", e);
        }
    };
</script>
