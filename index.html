        // -----------------------------------------------------------------
        // FIRESTORE HELPER FUNCTION

        async function addNewItem(collectionName = "items", dataObject = {}) {
            try {
                const docRef = await addDoc(collection(db, collectionName), {
                    ...dataObject,
                    createdAt: new Date()
                });
                console.log("Document written with ID: ", docRef.id);
                return docRef.id;
            } catch (error) {
                console.error("Error adding document: ", error);
                throw error;
            }
        }

        // -----------------------------------------------------------------
        // REALTIME FIREBASE FIRESTORE LISTENERS
        // -----------------------------------------------------------------

        onSnapshot(collection(db, "menu"), (snapshot) => {
            menuData = snapshot.docs.map(d => ({ _docId: d.id, ...d.data() }));
            menuData.sort((a, b) => (a.sortOrder !== undefined ? a.sortOrder : 0) - (b.sortOrder !== undefined ? b.sortOrder : 0));
            workingMenuData = JSON.parse(JSON.stringify(menuData));

            renderCustomerMenu();
            renderLocalMenu();
            renderDrinksMenu();
            renderCartSummary();
            renderAdminCatalog();
        }, (err) => console.error("Firestore Menu error:", err));

        onSnapshot(collection(db, "posts"), (snapshot) => {
            feedPosts = snapshot.docs.map(d => ({ _docId: d.id, ...d.data() }));
            feedPosts.sort((a, b) => (a.sortOrder !== undefined ? a.sortOrder : 0) - (b.sortOrder !== undefined ? b.sortOrder : 0));
            workingFeedPosts = JSON.parse(JSON.stringify(feedPosts));

            renderCustomerSocialFeeds();
            renderAdminPostsList();
        }, (err) => console.error("Firestore Posts error:", err));

        onSnapshot(collection(db, "orders"), (snapshot) => {
            ordersList = snapshot.docs.map(d => ({ _docId: d.id, ...d.data() }));
            ordersList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            renderAdminOrdersList();
        }, (err) => console.error("Firestore Orders error:", err));

        function toggleComments(postId) {
            expandedComments[postId] = !expandedComments[postId];
            renderCustomerSocialFeeds();
        }

        function toggleCommentSort(postId) {
            let current = commentSortModes[postId] || 'recent';
            commentSortModes[postId] = current === 'recent' ? 'oldest' : 'recent';
            renderCustomerSocialFeeds();
        }

        function toggleNestedReplies(key) {
            expandedReplies[key] = !expandedReplies[key];
            renderCustomerSocialFeeds();
        }

        function getTotalCommentsCount(post) {
            let count = post.comments ? post.comments.length : 0;
            if (post.comments) {
                post.comments.forEach(c => {
                    if (c.replies) count += c.replies.length;
                });
            }
            return count;
        }

        async function syncPostToFirestore(post) {
            if (post && post._docId) {
                await updateDoc(doc(db, "posts", post._docId), {
                    likes: post.likes || 0,
                    isLiked: post.isLiked || false,
                    comments: post.comments || []
                });
            }
        }

        async function likeComment(postId, commentIndex) {
            const post = feedPosts.find(p => p.id === postId || p._docId === postId);
            if (!post || !post.comments[commentIndex]) return;

            let identifier = currentUser ? currentUser.phone : (guestSessionName || "guest_session");
            const comment = post.comments[commentIndex];
            
            if (!comment.likedUsers) comment.likedUsers = [];
            if (!comment.dislikedUsers) comment.dislikedUsers = [];

            if (comment.likedUsers.includes(identifier)) {
                const idx = comment.likedUsers.indexOf(identifier);
                comment.likedUsers.splice(idx, 1);
                comment.likes = Math.max(0, (comment.likes || 1) - 1);
                showNotification('Like removed from comment.', 'warning');
            } else {
                const disIdx = comment.dislikedUsers.indexOf(identifier);
                if (disIdx !== -1) {
                    comment.dislikedUsers.splice(disIdx, 1);
                    comment.dislikes = Math.max(0, (comment.dislikes || 1) - 1);
                }
                comment.likedUsers.push(identifier);
                comment.likes = (comment.likes || 0) + 1;
                showNotification('Liked comment!');
            }

            await syncPostToFirestore(post);
        }

        async function dislikeComment(postId, commentIndex) {
            const post = feedPosts.find(p => p.id === postId || p._docId === postId);
            if (!post || !post.comments[commentIndex]) return;

            let identifier = currentUser ? currentUser.phone : (guestSessionName || "guest_session");
            const comment = post.comments[commentIndex];
            
            if (!comment.likedUsers) comment.likedUsers = [];
            if (!comment.dislikedUsers) comment.dislikedUsers = [];

            if (comment.dislikedUsers.includes(identifier)) {
                const idx = comment.dislikedUsers.indexOf(identifier);
                comment.dislikedUsers.splice(idx, 1);
                comment.dislikes = Math.max(0, (comment.dislikes || 1) - 1);
                showNotification('Dislike removed from comment.', 'warning');
            } else {
                const lIdx = comment.likedUsers.indexOf(identifier);
                if (lIdx !== -1) {
                    comment.likedUsers.splice(lIdx, 1);
                    comment.likes = Math.max(0, (comment.likes || 1) - 1);
                }
                comment.dislikedUsers.push(identifier);
                comment.dislikes = (comment.dislikes || 0) + 1;
                showNotification('Disliked comment.');
            }

            await syncPostToFirestore(post);
        }

        async function likeReply(postId, commentIndex, replyIndex) {
            const post = feedPosts.find(p => p.id === postId || p._docId === postId);
            if (!post || !post.comments[commentIndex] || !post.comments[commentIndex].replies[replyIndex]) return;

            let identifier = currentUser ? currentUser.phone : (guestSessionName || "guest_session");
            const reply = post.comments[commentIndex].replies[replyIndex];
            
            if (!reply.likedUsers) reply.likedUsers = [];
            if (!reply.dislikedUsers) reply.dislikedUsers = [];

            if (reply.likedUsers.includes(identifier)) {
                const idx = reply.likedUsers.indexOf(identifier);
                reply.likedUsers.splice(idx, 1);
                reply.likes = Math.max(0, (reply.likes || 1) - 1);
                showNotification('Like removed from reply.', 'warning');
            } else {
                const disIdx = reply.dislikedUsers.indexOf(identifier);
                if (disIdx !== -1) {
                    reply.dislikedUsers.splice(disIdx, 1);
                    reply.dislikes = Math.max(0, (reply.dislikes || 1) - 1);
                }
                reply.likedUsers.push(identifier);
                reply.likes = (reply.likes || 0) + 1;
                showNotification('Liked reply!');
            }

            await syncPostToFirestore(post);
        }

            const reply = post.comments[commentIndex].replies[replyIndex];
            
            if (!reply.likedUsers) reply.likedUsers = [];
            if (!reply.dislikedUsers) reply.dislikedUsers = [];

            if (reply.dislikedUsers.includes(identifier)) {
                const idx = reply.dislikedUsers.indexOf(identifier);
                reply.dislikedUsers.splice(idx, 1);
                reply.dislikes = Math.max(0, (reply.dislikes || 1) - 1);
                showNotification('Dislike removed from reply.', 'warning');
            } else {
                const lIdx = reply.likedUsers.indexOf(identifier);
                if (lIdx !== -1) {
                    reply.likedUsers.splice(lIdx, 1);
                    reply.likes = Math.max(0, (reply.likes || 1) - 1);

        function formatCommentTime(timestamp) {
            if (!timestamp) return 'Just now';
            const diffMs = Date.now() - timestamp;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} minutes ago`;
            if (diffHours < 24) return `${diffHours} hours ago`;
            if (diffDays === 1) return '1 day ago';
            return `${diffDays} days ago`;
        }

        function formatReplyText(text) {
            if (!text) return '';

        function sharePost(id, title, desc) {
            sharedPostText = `${title}\n\n${desc}\n\nCheck out Alqadri Chaska Point: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: desc,
                    url: window.location.href
                }).then(() => {
                    showNotification('Post shared successfully!');
                }).catch((err) => {
                    if (err.name !== 'AbortError') {
                        openCustomShareModal(title, desc);
                    }
                });
            } else {
                openCustomShareModal(title, desc);
            }
        }

        function openCustomShareModal(title, desc) {
            let shareText = `${title}\n\n${desc}`;
            let encodedText = encodeURIComponent(shareText);
            let currentUrl = encodeURIComponent(window.location.href);

            document.getElementById('shareWA').href = `https://api.whatsapp.com/send?text=${encodedText}%20${currentUrl}`;
            document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}&quote=${encodedText}`;
            document.getElementById('shareTW').href = `https://twitter.com/intent/tweet?text=${encodedText}&url=${currentUrl}`;

            document.getElementById('shareModal').classList.remove('hidden');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function copyShareLink() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(sharedPostText).then(() => {
                    showNotification('Post details copied to clipboard!');
                    closeShareModal();
                });
            } else {
                let textarea = document.createElement('textarea');
                textarea.value = sharedPostText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                showNotification('Post details copied to clipboard!');
                closeShareModal();
            }
        }

        async function downloadPostMedia(imageUrl, title) {
            try {
                showNotification('Downloading post image...');
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `ACP-${title.toLowerCase().replace(/[^a-z0-9]/g, '-')}.jpg`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
                showNotification('Image downloaded successfully!');
            } catch (err) {
                const link = document.createElement('a');
                link.href = imageUrl;
                link.target = '_blank';
                link.download = 'ACP-Post.jpg';
                document.body.appendChild(link);
                link.click();
                link.remove();
                showNotification('Opened image in new tab for saving.');
            }
        }

        async function likePost(id) {
            const post = feedPosts.find(p => p.id === id || p._docId === id);
            if (!post) return;

            post.isLiked = !post.isLiked;
            if (post.isLiked) {
                post.likes = (post.likes || 0) + 1;
                showNotification('Liked this post! ♥');
            } else {
                post.likes = Math.max(0, (post.likes || 1) - 1);
            }

            await syncPostToFirestore(post);
        }

        async function submitComment(id) {
            const post = feedPosts.find(p => p.id === id || p._docId === id);
            const input = document.getElementById(`comment-input-${id}`);
            
            if (!post || !input) return;

            const commentText = input.value.trim();
            if (!commentText) return;

            let commenterName = "";
            if (currentUser) {
                commenterName = currentUser.name;
            } else if (guestSessionName) {
                commenterName = guestSessionName;
            } else {
                openGuestNameModal();
                return;
            }

            if (!post.comments) post.comments = [];

            const replyToIndex = input.dataset.replyToIndex;
            if (replyToIndex !== undefined && replyToIndex !== "") {
                const idx = parseInt(replyToIndex);
                if (post.comments[idx]) {
                    if (!post.comments[idx].replies) post.comments[idx].replies = [];
                    
                    post.comments[idx].replies.push({
                        commenter: commenterName,
                        text: commentText,
                        isAdmin: false,
                        timestamp: Date.now(),
                        likes: 0,
                        dislikes: 0,
                        likedUsers: [],
                        dislikedUsers: []
                    });
                }
                delete input.dataset.replyToIndex;
            } else {
                post.comments.push({

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const icon = type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-triangle-exclamation text-amber-500';
            const accent = type === 'success' ? 'border-emerald-100 bg-white' : 'border-amber-100 bg-white';
            
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-3 rounded-xl border ${accent} shadow-md transition-all transform translate-x-12 opacity-0 pointer-events-auto w-full max-w-xs`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base shrink-0"></i>
                <div class="text-[10px] font-bold text-slate-800">${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-x-12', 'opacity-0');
                toast.classList.add('translate-x-0', 'opacity-100');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-x-12', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 2500);
        }

                delete cartItems[id];
            } else {
                cartItems[id] = newQty;

        function renderCartSummary() {
            const emptyState = document.getElementById('emptyCart');
            const activeState = document.getElementById('activeCart');
            const cartTableBody = document.getElementById('cartTableRows');
            const floatingCartBar = document.getElementById('floatingCartBar');
            const floatingCartCount = document.getElementById('floatingCartCount');
            const floatingCartTotal = document.getElementById('floatingCartTotal');
            
            const keys = Object.keys(cartItems);
            
            let totalItemsCount = 0;
            keys.forEach(k => {
                totalItemsCount += cartItems[k];
            });
            
            if (keys.length === 0) {
                if (emptyState) emptyState.style.display = 'block';
                if (activeState) activeState.style.display = 'none';
                
                if (floatingCartBar) {
                    floatingCartBar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
                    floatingCartBar.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                }
                return;
            }

            if (emptyState) emptyState.style.display = 'none';
            if (activeState) activeState.style.display = 'block';
            if (cartTableBody) cartTableBody.innerHTML = '';

            let grandTotal = 0;

            keys.forEach(id => {
                const item = menuData.find(x => x.id == id || x._docId == id);
                if (!item) return;

                const qty = cartItems[id];
                const total = item.price * qty;
                grandTotal += total;

                if (cartTableBody) {
                    cartTableBody.innerHTML += `
                        <tr>
                            <td class="font-bold py-2 text-slate-800">${item.name}</td>
                            <td class="text-center font-extrabold py-2">${qty}</td>
                            <td class="text-right font-black">Rs. ${total}</td>
                        </tr>
                    `;
                }
            });

            const txtSubtotal = document.getElementById('txtSubtotal');
            const txtGrandTotal = document.getElementById('txtGrandTotal');
            if (txtSubtotal) txtSubtotal.innerText = 'Rs. ' + grandTotal;
            if (txtGrandTotal) txtGrandTotal.innerText = 'Rs. ' + grandTotal;

            if (floatingCartBar) {
                if (floatingCartCount) floatingCartCount.innerText = totalItemsCount;
                if (floatingCartTotal) floatingCartTotal.innerText = 'Rs. ' + grandTotal;
                
                const viewStore = document.getElementById('view-store');
                if (viewStore && !viewStore.classList.contains('hidden')) {
                    floatingCartBar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                    floatingCartBar.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                }
            }
        }

        async function handleFeedPostSubmit(event) {

                const post = feedPosts.find(p => p._docId === editId || p.id == editId);
                if (post && post._docId) {
                    post.title = title;
                    post.image = image;
                    post.desc = desc;
                    renderCustomerSocialFeeds();
                    renderAdminPostsList();
                    showNotification('Post changes saved successfully!');

                    await updateDoc(doc(db, "posts", post._docId), {
                        title, image, desc, authorName: adminAuthorName
                    });
                }
            } else {
                const newPostId = feedPosts.length > 0 ? Math.max(...feedPosts.map(p => p.id || 0)) + 1 : 101;
                const newPostObj = {
                    id: newPostId,
                    title,
                    image,
                    desc,
                    authorName: adminAuthorName,
                    timestamp: Date.now(),
                    likes: 0,
                    isLiked: false,
                    comments: [],
                    sortOrder: 0
                };
                
                feedPosts.unshift(newPostObj);
                workingFeedPosts.unshift(newPostObj);
                renderCustomerSocialFeeds();
                renderAdminPostsList();
                showNotification('New post broadcasted live!');

                await addDoc(collection(db, "posts"), newPostObj);
            }

            resetPostForm();
        }

        function generateStoreInvoice() {
            const modalOverlay = document.getElementById('invoiceModalOverlay');
            const invoiceTableBody = document.getElementById('invoiceTableRows');
            const keys = Object.keys(cartItems);

            if (keys.length === 0) return;

            if (invoiceTableBody) invoiceTableBody.innerHTML = '';
            let totalAmount = 0;

            keys.forEach(id => {
                const item = menuData.find(x => x.id == id || x._docId == id);
                if (!item) return;

                const qty = cartItems[id];
                const total = item.price * qty;
                totalAmount += total;

                if (invoiceTableBody) {
                    invoiceTableBody.innerHTML += `
                        <tr class="text-slate-800">
                            <td class="py-2 font-bold">${item.name}</td>
                            <td class="text-center font-bold">${qty}</td>
                            <td class="text-right font-black">Rs. ${total}</td>
                        </tr>
                    `;
                }
            });

            const dateObj = new Date();
            const lblInvDate = document.getElementById('lblInvDate');
            if (lblInvDate) {
                lblInvDate.innerText = dateObj.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                });
            }
            return count;

        async function syncPostToFirestore(post) {
            if (post && post._docId) {
                await updateDoc(doc(db, "posts", post._docId), {

                    isLiked: post.isLiked || false,
                    comments: post.comments || []
                });
            }
        }

        async function likeComment(postId, commentIndex) {
            const post = feedPosts.find(p => p.id === postId || p._docId === postId);
            if (!post || !post.comments[commentIndex]) return;

            let identifier = currentUser ? currentUser.phone : (guestSessionName || "guest_session");
            const comment = post.comments[commentIndex];
            
            if (!comment.likedUsers) comment.likedUsers = [];
            if (!comment.dislikedUsers) comment.dislikedUsers = [];

            if (comment.likedUsers.includes(identifier)) {
                const idx = comment.likedUsers.indexOf(identifier);
                comment.likedUsers.splice(idx, 1);
                comment.likes = Math.max(0, (comment.likes || 1) - 1);
                showNotification('Like removed from comment.', 'warning');
            } else {
                const disIdx = comment.dislikedUsers.indexOf(identifier);
                if (disIdx !== -1) {
                    comment.dislikedUsers.splice(disIdx, 1);
                    comment.dislikes = Math.max(0, (comment.dislikes || 1) - 1);
                }
                comment.likedUsers.push(identifier);
                comment.likes = (comment.likes || 0) + 1;
                showNotification('Liked comment!');
            }

            await syncPostToFirestore(post);
        }

        function formatCommentTime(timestamp) {
            if (!timestamp) return 'Just now';
            const diffMs = Date.now() - timestamp;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} minutes ago`;
            if (diffHours < 24) return `${diffHours} hours ago`;
            if (diffDays === 1) return '1 day ago';
            return `${diffDays} days ago`;
        }

            if (!text) return '';

                    closeShareModal();
                });

        async function downloadPostMedia(imageUrl, title) {
            try {
                showNotification('Downloading post image...');
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `ACP-${title.toLowerCase().replace(/[^a-z0-9]/g, '-')}.jpg`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
                showNotification('Image downloaded successfully!');
            } catch (err) {
                const link = document.createElement('a');
                link.href = imageUrl;
                link.target = '_blank';
                link.download = 'ACP-Post.jpg';
                document.body.appendChild(link);

                showNotification('Opened image in new tab for saving.');
            }
        }

        async function submitComment(id) {
            const post = feedPosts.find(p => p.id === id || p._docId === id);
            const input = document.getElementById(`comment-input-${id}`);
            
            if (!post || !input) return;

            const commentText = input.value.trim();
            if (!commentText) return;

            let commenterName = "";
            if (currentUser) {
                commenterName = currentUser.name;
            } else if (guestSessionName) {
                commenterName = guestSessionName;
            } else {
                openGuestNameModal();
                return;
            }

            if (!post.comments) post.comments = [];

            const replyToIndex = input.dataset.replyToIndex;
            if (replyToIndex !== undefined && replyToIndex !== "") {
                const idx = parseInt(replyToIndex);
                if (post.comments[idx]) {
                    if (!post.comments[idx].replies) post.comments[idx].replies = [];
                    
                    post.comments[idx].replies.push({
                        commenter: commenterName,
                        text: commentText,
                        isAdmin: false,
                        timestamp: Date.now(),
                        likes: 0,
                        dislikes: 0,
                        likedUsers: [],
                        dislikedUsers: []
                    });
                }
                delete input.dataset.replyToIndex;
            } else {
                post.comments.push({ 
                    commenter: commenterName, 
                    text: commentText, 
                    isAdmin: false, 
                    timestamp: Date.now(), 
                    likes: 0, 
                    dislikes: 0, 
                    likedUsers: [],
                    dislikedUsers: [],
                    replies: [] 
                });
            }

            input.value = '';
            await syncPostToFirestore(post);
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const icon = type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-triangle-exclamation text-amber-500';
            const accent = type === 'success' ? 'border-emerald-100 bg-white' : 'border-amber-100 bg-white';
            
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-3 rounded-xl border ${accent} shadow-md transition-all transform translate-x-12 opacity-0 pointer-events-auto w-full max-w-xs`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base shrink-0"></i>
                <div class="text-[10px] font-bold text-slate-800">${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-x-12', 'opacity-0');
                toast.classList.add('translate-x-0', 'opacity-100');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-x-12', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 2500);
        }

        function renderCartSummary() {
            const emptyState = document.getElementById('emptyCart');
            const activeState = document.getElementById('activeCart');
            const cartTableBody = document.getElementById('cartTableRows');
            const floatingCartBar = document.getElementById('floatingCartBar');
            const floatingCartCount = document.getElementById('floatingCartCount');
            const floatingCartTotal = document.getElementById('floatingCartTotal');
            
            const keys = Object.keys(cartItems);
            
            let totalItemsCount = 0;
            keys.forEach(k => {
                totalItemsCount += cartItems[k];
            });
            
            if (keys.length === 0) {
                if (emptyState) emptyState.style.display = 'block';
                if (activeState) activeState.style.display = 'none';
                
                if (floatingCartBar) {
                    floatingCartBar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
                    floatingCartBar.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                }
                return;
            }

            if (emptyState) emptyState.style.display = 'none';
            if (activeState) activeState.style.display = 'block';
            if (cartTableBody) cartTableBody.innerHTML = '';

            let grandTotal = 0;

            keys.forEach(id => {
                const item = menuData.find(x => x.id == id || x._docId == id);
                if (!item) return;

                const qty = cartItems[id];
                const total = item.price * qty;
                grandTotal += total;

                if (cartTableBody) {
                    cartTableBody.innerHTML += `
                        <tr>
                            <td class="font-bold py-2 text-slate-800">${item.name}</td>
                            <td class="text-center font-extrabold py-2">${qty}</td>
                            <td class="text-right font-black">Rs. ${total}</td>
                        </tr>
                    `;
                }
            });

            const txtSubtotal = document.getElementById('txtSubtotal');
            const txtGrandTotal = document.getElementById('txtGrandTotal');
            if (txtSubtotal) txtSubtotal.innerText = 'Rs. ' + grandTotal;
            if (txtGrandTotal) txtGrandTotal.innerText = 'Rs. ' + grandTotal;

            if (floatingCartBar) {
                if (floatingCartCount) floatingCartCount.innerText = totalItemsCount;
                if (floatingCartTotal) floatingCartTotal.innerText = 'Rs. ' + grandTotal;
                
                const viewStore = document.getElementById('view-store');
                if (viewStore && !viewStore.classList.contains('hidden')) {
                    floatingCartBar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                    floatingCartBar.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                }
            }
        }

        function moveCatalogItem(id, direction) {
            const index = workingMenuData.findIndex(x => x.id === id || x._docId === id);
            if (index === -1) return;

            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            if (targetIndex < 0 || targetIndex >= workingMenuData.length) return;

            const temp = workingMenuData[index];
            workingMenuData[index] = workingMenuData[targetIndex];
            workingMenuData[targetIndex] = temp;

            renderAdminCatalog();

            const updateBar = document.getElementById('catalogUpdateBar');
            if (updateBar) updateBar.classList.remove('hidden');
        }

        async function deleteFeedPost(postId) {
            const post = feedPosts.find(p => p.id === postId || p._docId === postId);
            if (post && post._docId) {
                // INSTANT LOCAL UPDATE
                feedPosts = feedPosts.filter(p => p._docId !== post._docId);
                workingFeedPosts = workingFeedPosts.filter(p => p._docId !== post._docId);
                renderCustomerSocialFeeds();
                renderAdminPostsList();
                showNotification('Post deleted successfully!', 'warning');

                // BACKGROUND SYNC
                await deleteDoc(doc(db, "posts", post._docId));
            }
        }

        async function handleFeedPostSubmit(event) {
            event.preventDefault();

            const editId = document.getElementById('editPostId').value;
            const title = document.getElementById('postFormTitle').value.trim();
            const image = document.getElementById('postFormImage').value.trim();
            const desc = document.getElementById('postFormDesc').value.trim();

            if (!title || !image || !desc) {
                showNotification('Please fill in required post details.', 'warning');
                return;
            }

            const adminAuthorName = "Alqadri Chaska Point";

            if (editId) {
                const post = feedPosts.find(p => p._docId === editId || p.id == editId);
                if (post && post._docId) {
                    post.title = title;
                    post.image = image;
                    post.desc = desc;
                    renderCustomerSocialFeeds();
                    renderAdminPostsList();
                    showNotification('Post changes saved successfully!');

                    await updateDoc(doc(db, "posts", post._docId), {
                        title, image, desc, authorName: adminAuthorName
                    });
                }
            } else {
                const newPostId = feedPosts.length > 0 ? Math.max(...feedPosts.map(p => p.id || 0)) + 1 : 101;
                const newPostObj = {
                    id: newPostId,
                    title,
                    image,
                    desc,
                    authorName: adminAuthorName,
                    timestamp: Date.now(),
                    likes: 0,
                    isLiked: false,
                    comments: [],
                    sortOrder: 0
                };
                
                feedPosts.unshift(newPostObj);
                workingFeedPosts.unshift(newPostObj);
                renderCustomerSocialFeeds();
                renderAdminPostsList();
                showNotification('New post broadcasted live!');

                await addDoc(collection(db, "posts"), newPostObj);
            }

            resetPostForm();
        }

        function searchUsers(keyword) {
            const filtered = registeredUsers.filter(u => 
                (u.name && u.name.toLowerCase().includes(keyword.toLowerCase())) || 
                (u.phone && u.phone.includes(keyword)) || 
                (u.location && u.location.toLowerCase().includes(keyword.toLowerCase())) ||
                (u.email && u.email.toLowerCase().includes(keyword.toLowerCase()))
            );
            renderRegisteredUsers(filtered);
        }

        async function deleteFoodCatalog(id) {
            const item = menuData.find(x => x.id == id || x._docId == id);
            if (item) {
                if (cartItems[item.id]) delete cartItems[item.id];
                
                // INSTANT LOCAL UPDATE
                menuData = menuData.filter(x => x.id !== id && x._docId !== item._docId);
                workingMenuData = workingMenuData.filter(x => x.id !== id && x._docId !== item._docId);
                renderCustomerMenu();
                renderLocalMenu();
                renderDrinksMenu();
                renderCartSummary();
                renderAdminCatalog();
                showNotification('Item removed from catalog.');

                if (item._docId) {
                    await deleteDoc(doc(db, "menu", item._docId));
                }
            }
        }

        function loadFoodToEdit(id) {
            const item = menuData.find(x => x.id == id || x._docId == id);
            if (!item) return;

            document.getElementById('editFoodId').value = item._docId || item.id;
            document.getElementById('foodFormName').value = item.name;
            document.getElementById('foodFormPrice').value = item.price;
            document.getElementById('foodFormImage').value = item.image;
            document.getElementById('foodFormDesc').value = item.desc || '';
            document.getElementById('foodFormCategory').value = item.category || 'fast';

            document.getElementById('formPanelTitle').innerText = 'Edit Food Item Details';
            document.getElementById('foodFormSubmitBtn').innerHTML = '<i class="fa-solid fa-save mr-1"></i> Save Changes';

            switchCatalogSubTab('add');
        }

        async function handleFoodFormSubmit(event) {
            event.preventDefault();

            const editId = document.getElementById('editFoodId').value;
            const name = document.getElementById('foodFormName').value.trim();
            const price = parseInt(document.getElementById('foodFormPrice').value);
            let image = document.getElementById('foodFormImage').value.trim();
            const desc = document.getElementById('foodFormDesc').value.trim();
            const category = document.getElementById('foodFormCategory').value;

            if (!name || isNaN(price)) {
                showNotification('Please fill in required name and price fields.', 'warning');
                return;
            }

            if (!image) {
                image = 'https://placehold.co/400x300/FF5A36/ffffff?text=ACP';
            }

            if (editId) {
                const item = menuData.find(x => x._docId === editId || x.id == editId);
                if (item && item._docId) {
                    item.name = name;
                    item.price = price;
                    item.image = image;
                    item.desc = desc;
                    item.category = category;

                    renderCustomerMenu();
                    renderLocalMenu();
                    renderDrinksMenu();
                    renderCartSummary();
                    renderAdminCatalog();
                    showNotification('Changes saved successfully!');

                    await updateDoc(doc(db, "menu", item._docId), {
                        name, price, image, desc, category
                    });
                }
            } else {
                const newId = menuData.length > 0 ? Math.max(...menuData.map(x => x.id || 0)) + 1 : 1;
                const newItemObj = {
                    id: newId,
                    name,
                    price,
                    image,
                    desc,
                    category,
                    sortOrder: menuData.length
                };

                menuData.push(newItemObj);
                workingMenuData.push(newItemObj);
                renderCustomerMenu();
                renderLocalMenu();
                renderDrinksMenu();
                renderAdminCatalog();
                showNotification('Product successfully added to the catalog!');

                await addDoc(collection(db, "menu"), newItemObj);
            }

            resetAdminForm();
        }

        function resetAdminForm() {
            document.getElementById('editFoodId').value = '';
            document.getElementById('adminFoodForm').reset();
            document.getElementById('formPanelTitle').innerText = 'Add New Food Item';
            document.getElementById('foodFormSubmitBtn').innerHTML = '<i class="fa-solid fa-save mr-1"></i> Save Product';
        }

        function generateStoreInvoice() {
            const modalOverlay = document.getElementById('invoiceModalOverlay');
            const invoiceTableBody = document.getElementById('invoiceTableRows');
            const keys = Object.keys(cartItems);

            if (keys.length === 0) return;

            if (invoiceTableBody) invoiceTableBody.innerHTML = '';
            let totalAmount = 0;

            keys.forEach(id => {
                const item = menuData.find(x => x.id == id || x._docId == id);
                if (!item) return;

                const qty = cartItems[id];
                const total = item.price * qty;
                totalAmount += total;

                if (invoiceTableBody) {
                    invoiceTableBody.innerHTML += `
                        <tr class="text-slate-800">
                            <td class="py-2 font-bold">${item.name}</td>
                            <td class="text-center font-bold">${qty}</td>
                            <td class="text-right font-black">Rs. ${total}</td>
                        </tr>
                    `;
                }
            });

            const dateObj = new Date();
            const lblInvDate = document.getElementById('lblInvDate');
            if (lblInvDate) {
                lblInvDate.innerText = dateObj.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            }

            const lblTxnId = document.getElementById('lblTxnId');
            if (lblTxnId) {
                lblTxnId.innerText = '#ACP-' + Math.floor(1000 + Math.random() * 9000);
            }

            const lblSub = document.getElementById('lblSub');
            if (lblSub) lblSub.innerText = 'Rs. ' + totalAmount;

            if (modalOverlay) modalOverlay.style.display = 'flex';
        }

        function closeReceiptAndScrollToMenu() {
            const modalOverlay = document.getElementById('invoiceModalOverlay');
            if (modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        }

        function downloadInvoiceJPG() {
            const element = document.getElementById('receiptContainer');
            
            const options = {
                scale: 4,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                scrollX: 0,
                scrollY: -window.scrollY,
                windowWidth: document.documentElement.offsetWidth,
                windowHeight: document.documentElement.offsetHeight,
                ignoreElements: (el) => el.classList.contains('no-print')
            };

            showNotification('Generating ultra-high-res receipt image...');
            
            html2canvas(element, options).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Alqadri-HighRes-Receipt.jpg';
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
                showNotification('High-resolution JPG saved successfully!');
            }).catch(err => {
                console.error("JPG capture error: ", err);
                showNotification('Failed to generate crisp JPG receipt.', 'warning');
            });
        }
